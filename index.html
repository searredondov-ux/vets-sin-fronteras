quiero poner ese <!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vets Sin Fronteras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --deep-teal: #1E3D3D;
    --deep-teal-2: #16302F;
    --sand: #F6F0E4;
    --sand-card: #FDFBF6;
    --gold: #C9A227;
    --gold-soft: #E4CD82;
    --ink: #1B2723;
    --ink-soft: #5B6B65;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: var(--sand);
    background-image:
      radial-gradient(circle at 15% 8%, rgba(30,61,61,0.05), transparent 40%),
      radial-gradient(circle at 85% 92%, rgba(201,162,39,0.08), transparent 40%);
    font-family: 'Work Sans', sans-serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 48px 16px;
  }

  .page {
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Avatar */
  .avatar-wrap {
    position: relative;
    width: 108px;
    height: 108px;
    margin-bottom: 22px;
  }
  .avatar-ring {
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    border: 1.5px dashed var(--gold);
    animation: spin 40s linear infinite;
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .avatar-ring { animation: none; }
  }
  .avatar {
    width: 108px;
    height: 108px;
    border-radius: 50%;
    background: linear-gradient(160deg, var(--deep-teal), var(--deep-teal-2));
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 10px 24px rgba(30,61,61,0.25);
    overflow: hidden;
  }
  .avatar svg { width: 48px; height: 48px; }
  .avatar-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Name + bio */
  .name {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 26px;
    letter-spacing: -0.01em;
    color: var(--deep-teal);
    text-align: center;
    margin: 0;
  }

  .stitch {
    width: 120px;
    height: 10px;
    margin: 10px 0 16px;
    background-image: radial-gradient(circle, var(--gold) 1.6px, transparent 1.6px);
    background-size: 9px 9px;
    background-repeat: repeat-x;
    background-position: center;
    opacity: 0.85;
  }

  .bio {
    text-align: center;
    font-size: 15px;
    line-height: 1.55;
    color: var(--ink-soft);
    max-width: 300px;
    margin: 0 0 32px;
  }
  .bio strong { color: var(--deep-teal); font-weight: 600; }

  /* Links */
  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .link-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 16px 18px;
    background: var(--sand-card);
    border: 1px solid rgba(30,61,61,0.10);
    border-radius: 16px;
    text-decoration: none;
    color: var(--ink);
    box-shadow: 0 2px 8px rgba(30,61,61,0.05);
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }
  .link-btn:hover, .link-btn:focus-visible {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(30,61,61,0.12);
    border-color: var(--gold-soft);
    outline: none;
  }
  .link-btn:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }

  .icon-badge {
    flex: 0 0 auto;
    width: 42px;
    height: 42px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-badge svg { width: 22px; height: 22px; }

  .badge-instagram {
    background: linear-gradient(135deg, #F1B14C, #C8395A 45%, #6B3FA0);
  }
  .badge-whatsapp {
    background: #25D366;
  }

  .link-text {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .link-title {
    font-weight: 600;
    font-size: 15px;
    color: var(--deep-teal);
  }
  .link-sub {
    font-size: 12.5px;
    color: var(--ink-soft);
  }

  .arrow {
    flex: 0 0 auto;
    width: 18px;
    height: 18px;
    color: var(--ink-soft);
    transition: transform 0.15s ease;
  }
  .link-btn:hover .arrow { transform: translateX(3px); color: var(--deep-teal); }

  footer {
    margin-top: 36px;
    font-size: 11.5px;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    text-transform: uppercase;
    opacity: 0.7;
  }
</style>
</head>
